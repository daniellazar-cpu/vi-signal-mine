[project]
name = "vi-signal-mine"
version = "0.1.0"
description = "A pulse instrument: what is being said about a brand or product online, and what changed"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "jinja2",
    "httpx",
    "python-multipart",
    "pyyaml",
    "anthropic",
]

[project.optional-dependencies]
dev = ["pytest"]
# Never a core dependency: the local tool and the hermetic test suite must
# install and run without a database driver. Only needed when a Postgres URL
# is actually configured (see vsm/backends/dburl.py, vsm/storage.py).
postgres = ["psycopg[binary]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.setuptools.packages.find]
include = ["vsm*"]
